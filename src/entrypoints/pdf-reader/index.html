<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 翻译 · 简简单单翻译</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #202124; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px max(16px, calc((100vw - 900px)/2)); background: #fff; border-bottom: 1px solid #e5e7eb; }
    header strong { font-size: 15px; white-space: nowrap; }
    #source-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5f6368; font-size: 13px; }
    button { border: 1px solid #d0d7de; background: #fff; color: #202124; border-radius: 7px; padding: 7px 11px; font-size: 13px; cursor: pointer; }
    button.primary { color: #fff; background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { max-width: 900px; margin: 18px auto 0; padding: 0 20px; color: #5f6368; font-size: 13px; }
    main { max-width: 820px; margin: 28px auto 80px; padding: 0 22px; }
    .paper-title { font-size: clamp(25px, 4vw, 36px); line-height: 1.25; margin: 0 0 18px; font-weight: 700; }
    .paper-meta { color: #697386; font-size: 13px; margin-bottom: 30px; overflow-wrap: anywhere; }
    section { margin: 30px 0; }
    h2 { font-size: 21px; line-height: 1.35; margin: 0 0 15px; }
    .paragraph { margin: 0 0 18px; font-size: 16px; line-height: 1.82; white-space: pre-wrap; overflow-wrap: anywhere; }
    .original { color: #68717d; font-size: 14px; line-height: 1.7; margin-top: 8px; }
    .translation { color: #202124; font-size: 16px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
    .block { padding: 0 0 18px; border-bottom: 1px solid #e9ebef; margin-bottom: 20px; }
    .block-actions { display:flex; justify-content:flex-end; margin-top:6px; }
    .hidden { display:none !important; }
    .error { color: #b42318 !important; }
    @media (max-width: 600px) {
      header { gap: 7px; padding: 10px 12px; flex-wrap: wrap; }
      header strong { font-size: 14px; }
      #source-title { order: 5; flex-basis: 100%; }
      header button { padding: 7px 9px; }
      main { margin-top: 20px; padding: 0 17px; }
      .paragraph, .translation { font-size: 15px; }
    }
    @media (prefers-color-scheme: dark) {
      body { background:#17191c; color:#e8eaed; }
      header { background:#202327; border-color:#383d44; }
      button { background:#292e34; color:#e8eaed; border-color:#50565f; }
      .paper-meta,.original,#source-title,#status { color:#aab2bd; }
      .block { border-color:#383d44; }
    }
  </style>
</head>
<body>
  <header>
    <strong>PDF 翻译</strong>
    <span id="source-title">正在加载论文…</span>
    <button id="mode-toggle">仅显示译文</button>
    <button id="translate" class="primary">翻译全文</button>
    <button id="back">返回 PDF</button>
  </header>
  <div id="status" role="status">正在读取 PDF…</div>
  <main id="paper" aria-live="polite"></main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
