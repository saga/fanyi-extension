name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout vocal-saga for cross-project checks
        uses: actions/checkout@v4
        with:
          repository: devweekly/vocal-saga
          ref: main
          path: .cross-sync/vocal-saga
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check shared translation modules
        env:
          VOCAL_SAGA_PATH: ${{ github.workspace }}/.cross-sync/vocal-saga
          FANYI_EXTENSION_PATH: ${{ github.workspace }}
        run: pnpm dlx tsx .cross-sync/vocal-saga/scripts/check-sync.ts
      - name: Unit tests
        run: pnpm test
      - name: Build Chrome extension
        run: pnpm build
      - name: Build Firefox extension
        run: pnpm build:firefox
